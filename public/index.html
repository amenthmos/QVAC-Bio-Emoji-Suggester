<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Bio Emoji Suggester</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fff5eb 0%, #ffe0c2 100%);
    font-family: system-ui, sans-serif;
    color: #5c3410;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 480px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #d1691e; font-weight: 800; }
  .subtitle { color: #96603a; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(209,105,30,0.12);
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #f7d3ac;
    background: #fffaf3;
    color: #5c3410;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    text-align: center;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #e07b2c;
    color: #fff;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #96603a; min-height: 1.2em; }
  .emoji-row { font-size: 2.2rem; letter-spacing: 6px; margin-top: 20px; }
  .bio-preview {
    margin-top: 16px;
    background: #fff2e2;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 1.1rem;
    color: #d1691e;
    font-weight: 600;
  }
  .footer-note { color: #96603a; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #ffe0c2;
    border-top-color: #e07b2c;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">😄</div>
    <h1>QVAC Bio Emoji Suggester</h1>
    <p class="subtitle">Enter your interests, get emoji for your social bio. 100% on-device.</p>

    <div class="card">
      <input type="text" id="mainInput" placeholder="e.g. hiking, coffee, photography, dogs" />
      <button class="action" id="generateBtn">Suggest Emoji</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Picking emoji...';

      try {
        const res = await fetch('/api/emoji', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interests: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        const list = data.emoji || [];
        const row = list.join(' ');
        resultBox.innerHTML = `
          <div class="emoji-row">${row}</div>
          <div class="bio-preview">${escapeHtml(row)}</div>
        `;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
